services:
  - type: web
    name: smart-manufacturing-api
    runtime: python
    rootDir: smart_manufacturing
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: smart-manufacturing-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: smart-manufacturing-db
    databaseName: smart_manufacturing
    user: postgres
    plan: free
