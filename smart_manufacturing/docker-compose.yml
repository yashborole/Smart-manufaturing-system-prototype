version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_mes_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-smart_manufacturing}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_manufacturing}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mes-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_mes_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-smart_manufacturing}
      PROJECT_NAME: "Smart Manufacturing MES"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@smartmes.com}
      PORT: 8000
    ports:
      - "${APP_PORT:-8000}:8000"

  mes-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_mes_simulator
    restart: always
    depends_on:
      mes-app:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-smart_manufacturing}
    command: ["python", "simulate_factory.py"]

volumes:
  postgres_data:
    driver: local
