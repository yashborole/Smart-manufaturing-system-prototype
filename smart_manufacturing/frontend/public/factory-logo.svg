<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Precision Production Hex Carrier Chassis -->
  <rect width="48" height="48" rx="8" fill="#090d16" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="7.25" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Outer Precision Machined Border Guides -->
  <line x1="8" y1="12" x2="14" y2="12" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <line x1="34" y1="12" x2="40" y2="12" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <line x1="8" y1="36" x2="14" y2="36" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <line x1="34" y1="36" x2="40" y2="36" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

  <!-- Industrial Manufacturing Plant Profile -->
  <!-- Bay 1 with Sawtooth Roofline -->
  <path d="M 11 35 L 11 23 L 19 18 L 19 35 Z" fill="#0284c7" />
  <!-- Bay 2 Core Production Tower -->
  <path d="M 20 35 L 20 15 L 28 11 L 28 35 Z" fill="#38bdf8" />
  <!-- Bay 3 Assembly Finishing Bay -->
  <path d="M 29 35 L 29 21 L 37 17 L 37 35 Z" fill="#0284c7" />

  <!-- Heavy Machine Ground Baseline -->
  <line x1="9" y1="35" x2="39" y2="35" stroke="#cbd5e1" stroke-width="2" stroke-linecap="square" />

  <!-- Connected Plant Operations Telemetry Node -->
  <circle cx="28" cy="11" r="2.2" fill="#ffffff" />
  <circle cx="28" cy="11" r="4.2" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 1.5" />
</svg>
